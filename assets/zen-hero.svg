<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#07111F"/>
      <stop offset="62%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="170" y1="150" x2="1030" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="13%" stop-color="#FDBA74"/>
      <stop offset="31%" stop-color="#F97316"/>
      <stop offset="56%" stop-color="#F43F5E"/>
      <stop offset="76%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="50%" stop-color="#FDBA74" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orangeBlue" x1="180" y1="0" x2="1020" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="20%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.70"/>
      <stop offset="42%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="75%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/>
    </pattern>

    <filter id="nameGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 1
        0 1 0 0 0.42
        0 0 1 0 0.05
        0 0 0 0.95 0" result="orangeGlow"/>
      <feMerge>
        <feMergeNode in="orangeGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 0.18
        0 0 0 0 0.45
        0 0 0 0 1
        0 0 0 0.78 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .grid { animation: drift 20s linear infinite; }
      .flag { animation: flagWave 8s ease-in-out infinite; transform-origin: 600px 250px; }
      .flag2 { animation: flagWave2 11s ease-in-out infinite; transform-origin: 600px 250px; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .orbit { transform-origin: 600px 244px; animation: rotate 18s linear infinite; }
      .orbitReverse { transform-origin: 600px 244px; animation: rotateReverse 26s linear infinite; }
      .pulse { animation: pulse 3.7s ease-in-out infinite; transform-origin: 600px 245px; }
      .name {
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        animation: draw 4.2s ease forwards, namePulse 5.2s ease-in-out infinite 4.2s;
      }
      .subline { animation: rise 1.1s ease-out forwards; }
      .plaque { animation: plaqueIn 1.25s ease-out forwards; }
      .star { animation: starPulse 3.2s ease-in-out infinite; }
      .star2 { animation: starPulse 4.5s ease-in-out infinite 0.65s; }
      .star3 { animation: starPulse 5.1s ease-in-out infinite 1.2s; }
      .spark { animation: spark 3.5s ease-in-out infinite; transform-origin: center; }
      .spark2 { animation: spark 4.7s ease-in-out infinite .5s; transform-origin: center; }
      .cta { animation: ctaPulse 2.4s ease-in-out infinite; }

      @keyframes drift {
        from { transform: translate(0px, 0px); }
        to { transform: translate(42px, 42px); }
      }

      @keyframes flagWave {
        0%,100% { transform: translateY(0px) skewX(-7deg); opacity: .20; }
        50% { transform: translateY(-8px) skewX(-11deg); opacity: .36; }
      }

      @keyframes flagWave2 {
        0%,100% { transform: translateY(4px) skewX(6deg); opacity: .16; }
        50% { transform: translateY(-5px) skewX(10deg); opacity: .30; }
      }

      @keyframes scan {
        0%, 100% { transform: translateX(-820px); opacity: 0; }
        20% { opacity: .85; }
        55% { transform: translateX(860px); opacity: .45; }
        80% { opacity: 0; }
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes pulse {
        0%,100% { transform: scale(.98); opacity: .42; }
        50% { transform: scale(1.04); opacity: .84; }
      }

      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }

      @keyframes namePulse {
        0%,100% { filter: drop-shadow(0 0 7px rgba(249,115,22,.38)); }
        50% { filter: drop-shadow(0 0 24px rgba(56,189,248,.60)); }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes plaqueIn {
        from { opacity: 0; transform: translateY(18px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes starPulse {
        0%,100% { opacity: .18; transform: scale(.78); }
        50% { opacity: .92; transform: scale(1.18); }
      }

      @keyframes spark {
        0%,100% { opacity: .18; transform: scale(.75); }
        50% { opacity: 1; transform: scale(1.26); }
      }

      @keyframes ctaPulse {
        0%,100% { opacity: .75; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="36" fill="url(#bg)"/>
  <rect class="grid" width="1320" height="620" x="-60" y="-60" fill="url(#grid)"/>

  <circle class="pulse" cx="600" cy="245" r="330" fill="url(#coreGlow)"/>

  <!-- Abstract American flag layer -->
  <g opacity="0.85">
    <g class="flag">
      <path d="M95 118C250 80 355 152 506 113C660 73 773 133 925 97C1025 73 1089 83 1150 103" stroke="#EF4444" stroke-width="18" stroke-linecap="round" opacity=".36"/>
      <path d="M78 158C238 120 366 190 520 151C680 111 803 174 955 135C1048 111 1102 126 1164 145" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity=".26"/>
      <path d="M55 201C226 165 370 229 532 194C690 160 825 223 980 184C1073 161 1124 178 1168 194" stroke="#EF4444" stroke-width="14" stroke-linecap="round" opacity=".30"/>
    </g>

    <g class="flag2">
      <path d="M40 292C238 246 396 322 580 281C745 244 870 306 1030 266C1110 246 1150 254 1186 269" stroke="#2563EB" stroke-width="16" stroke-linecap="round" opacity=".26"/>
      <path d="M84 337C255 300 407 363 588 328C766 294 891 354 1042 318C1115 301 1160 313 1195 330" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".20"/>
      <path d="M130 378C300 347 438 405 606 371C780 336 910 390 1065 356C1120 344 1165 351 1194 366" stroke="#EF4444" stroke-width="13" stroke-linecap="round" opacity=".24"/>
    </g>

    <rect x="70" y="74" width="174" height="120" rx="20" fill="#0B1E4A" opacity=".42"/>
    <g fill="#FFFFFF" filter="url(#blueGlow)">
      <circle class="star" cx="101" cy="101" r="3"/>
      <circle class="star2" cx="136" cy="101" r="2.5"/>
      <circle class="star3" cx="171" cy="101" r="3"/>
      <circle class="star" cx="206" cy="101" r="2.5"/>
      <circle class="star2" cx="118" cy="130" r="2.8"/>
      <circle class="star3" cx="153" cy="130" r="2.4"/>
      <circle class="star" cx="188" cy="130" r="2.8"/>
      <circle class="star2" cx="223" cy="130" r="2.4"/>
      <circle class="star3" cx="101" cy="159" r="2.6"/>
      <circle class="star" cx="136" cy="159" r="3"/>
      <circle class="star2" cx="171" cy="159" r="2.6"/>
      <circle class="star3" cx="206" cy="159" r="3"/>
    </g>
  </g>

  <!-- Orbital infrastructure lines -->
  <g opacity="0.92">
    <path class="orbit" d="M152 244C286 84 493 56 600 56C814 56 1000 122 1082 244C960 398 760 430 600 430C386 430 234 370 152 244Z" stroke="url(#orangeBlue)" stroke-width="1.35"/>
    <path class="orbitReverse" d="M230 244C342 137 464 105 600 105C736 105 858 137 970 244C858 351 736 383 600 383C464 383 342 351 230 244Z" stroke="#38BDF8" stroke-opacity=".38" stroke-width="1"/>
    <path class="orbit" d="M600 54C684 134 724 201 724 244C724 287 684 354 600 434C516 354 476 287 476 244C476 201 516 134 600 54Z" stroke="#F97316" stroke-opacity=".42" stroke-width="1"/>
  </g>

  <!-- Light sweep -->
  <g class="scan">
    <rect x="235" y="-20" width="92" height="560" fill="url(#silver)" opacity=".23" transform="skewX(-18)"/>
  </g>

  <!-- Sparks -->
  <g filter="url(#blueGlow)">
    <circle class="spark" cx="322" cy="92" r="4" fill="#38BDF8"/>
    <circle class="spark2" cx="890" cy="88" r="4" fill="#F97316"/>
    <circle class="spark" cx="1020" cy="190" r="3.7" fill="#A855F7"/>
    <circle class="spark2" cx="286" cy="371" r="3.6" fill="#F97316"/>
    <circle class="spark" cx="964" cy="392" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- Name -->
  <text x="600" y="156"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="82"
        font-weight="950"
        letter-spacing="8"
        fill="url(#nameGrad)"
        stroke="#FFFFFF"
        stroke-opacity=".24"
        stroke-width="1.25"
        filter="url(#nameGlow)"
        class="name">
    ALEX LESCHIK
  </text>

  <path d="M292 178H908" stroke="url(#silver)" stroke-width="2" stroke-linecap="round" opacity=".72"/>

  <text x="600" y="213"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17"
        font-weight="900"
        letter-spacing="4.2"
        fill="#FDBA74"
        class="subline">
    FOUNDER OF ZEN AI CO. · CREATOR OF ARSENAL
  </text>

  <!-- Fixed two-line historical plaque -->
  <g class="plaque">
    <rect x="232" y="238" width="736" height="92" rx="26" fill="#020617" fill-opacity=".70" stroke="url(#orangeBlue)" stroke-width="2.2"/>
    <rect x="246" y="252" width="708" height="64" rx="20" fill="#0F172A" fill-opacity=".42" stroke="#FFFFFF" stroke-opacity=".10"/>

    <text x="600" y="280"
          text-anchor="middle"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20"
          font-weight="950"
          letter-spacing="2.2"
          fill="#FFFFFF">
      FOUNDER OF THE 1ST YOUTH AI LITERACY PROGRAM
    </text>

    <text x="600" y="306"
          text-anchor="middle"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18"
          font-weight="900"
          letter-spacing="4.6"
          fill="#CBD5E1">
      IN UNITED STATES HISTORY
    </text>
  </g>

  <!-- Direction line -->
  <g filter="url(#nameGlow)">
    <path d="M410 364H790" stroke="url(#orangeBlue)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M382 364L410 347V381L382 364Z" fill="#F97316"/>
    <path d="M818 364L790 347V381L818 364Z" fill="#38BDF8"/>
  </g>

  <text x="600" y="403"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15"
        font-weight="900"
        letter-spacing="3.1"
        fill="#E2E8F0"
        class="cta">
    CLICK THE HERO TO ENTER ARSENAL.WORLD
  </text>

  <text x="600" y="436"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="13"
        font-weight="800"
        letter-spacing="2.3"
        fill="#94A3B8">
    AGENTS → AUTOMATIONS → DASHBOARDS → CREDENTIALS → ECOSYSTEM
  </text>
</svg>
