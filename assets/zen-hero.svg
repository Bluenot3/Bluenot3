<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="28%" stop-color="#06101F"/>
      <stop offset="52%" stop-color="#0B1120"/>
      <stop offset="78%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.52"/>
      <stop offset="34%" stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="62%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGradient" x1="150" y1="170" x2="1050" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="13%" stop-color="#FDBA74"/>
      <stop offset="28%" stop-color="#F97316"/>
      <stop offset="47%" stop-color="#FB7185"/>
      <stop offset="67%" stop-color="#A855F7"/>
      <stop offset="84%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="whiteHot" x1="250" y1="0" x2="950" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="24%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FDBA74" stop-opacity="1"/>
      <stop offset="76%" stop-color="#38BDF8" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orangeBlue" x1="140" y1="0" x2="1060" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="18%" stop-color="#F97316"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="76%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flagRed" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0"/>
      <stop offset="18%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="84%" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <pattern id="microgrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#334155" stroke-width="1" opacity="0.14"/>
      <circle cx="0" cy="0" r="1.1" fill="#475569" opacity="0.18"/>
    </pattern>

    <filter id="nameGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 1
        0 1 0 0 0.38
        0 0 1 0 0.08
        0 0 0 0.92 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 0.12
        0 0 0 0 0.38
        0 0 0 0 1
        0 0 0 0.78 0" result="blue"/>
      <feMerge>
        <feMergeNode in="blue"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="560" rx="38"/>
    </clipPath>

    <style>
      .grid {
        animation: gridDrift 22s linear infinite;
      }

      .flagA {
        transform-origin: 600px 280px;
        animation: flagWaveA 8s ease-in-out infinite;
      }

      .flagB {
        transform-origin: 600px 280px;
        animation: flagWaveB 11s ease-in-out infinite;
      }

      .orbitA {
        transform-origin: 600px 278px;
        animation: rotateA 24s linear infinite;
      }

      .orbitB {
        transform-origin: 600px 278px;
        animation: rotateB 31s linear infinite;
      }

      .orbitC {
        transform-origin: 600px 278px;
        animation: rotateC 19s linear infinite;
      }

      .pulseCore {
        transform-origin: 600px 278px;
        animation: pulseCore 4.2s ease-in-out infinite;
      }

      .name {
        stroke-dasharray: 1900;
        stroke-dashoffset: 1900;
        animation: drawName 3.8s cubic-bezier(.2,.8,.2,1) forwards, nameBreath 5.4s ease-in-out infinite 3.8s;
      }

      .ghost {
        animation: ghostFloat 7.5s ease-in-out infinite;
      }

      .subtitle {
        animation: rise 1.1s ease-out forwards;
      }

      .plaque {
        animation: plaqueIn 1.2s ease-out forwards;
      }

      .beam {
        animation: beamSweep 5.5s ease-in-out infinite;
      }

      .node {
        animation: nodePulse 3.2s ease-in-out infinite;
      }

      .node2 {
        animation: nodePulse 4.4s ease-in-out infinite .5s;
      }

      .node3 {
        animation: nodePulse 5.1s ease-in-out infinite 1.1s;
      }

      .flow {
        stroke-dasharray: 8 18;
        animation: flowLine 2.8s linear infinite;
      }

      .cta {
        animation: ctaPulse 2.4s ease-in-out infinite;
      }

      .terminal {
        animation: terminalIn 1.25s ease-out forwards;
      }

      @keyframes gridDrift {
        from { transform: translate(0px,0px); }
        to { transform: translate(38px,38px); }
      }

      @keyframes flagWaveA {
        0%,100% { transform: translateY(0) skewX(-6deg); opacity: .22; }
        50% { transform: translateY(-10px) skewX(-10deg); opacity: .38; }
      }

      @keyframes flagWaveB {
        0%,100% { transform: translateY(5px) skewX(6deg); opacity: .16; }
        50% { transform: translateY(-6px) skewX(10deg); opacity: .31; }
      }

      @keyframes rotateA {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateB {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes rotateC {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      @keyframes pulseCore {
        0%,100% { transform: scale(.98); opacity: .46; }
        50% { transform: scale(1.035); opacity: .86; }
      }

      @keyframes drawName {
        to { stroke-dashoffset: 0; }
      }

      @keyframes nameBreath {
        0%,100% { filter: drop-shadow(0 0 8px rgba(249,115,22,.40)); }
        50% { filter: drop-shadow(0 0 25px rgba(56,189,248,.62)); }
      }

      @keyframes ghostFloat {
        0%,100% { transform: translateY(0px); opacity: .055; }
        50% { transform: translateY(-8px); opacity: .105; }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes plaqueIn {
        from { opacity: 0; transform: translateY(18px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes beamSweep {
        0%,100% { transform: translateX(-760px) skewX(-18deg); opacity: 0; }
        18% { opacity: .65; }
        54% { transform: translateX(780px) skewX(-18deg); opacity: .28; }
        80% { opacity: 0; }
      }

      @keyframes nodePulse {
        0%,100% { transform: scale(.78); opacity: .22; }
        50% { transform: scale(1.18); opacity: 1; }
      }

      @keyframes flowLine {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -52; }
      }

      @keyframes ctaPulse {
        0%,100% { opacity: .72; }
        50% { opacity: 1; }
      }

      @keyframes terminalIn {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <rect class="grid" x="-50" y="-50" width="1300" height="660" fill="url(#microgrid)"/>
    <circle class="pulseCore" cx="600" cy="278" r="360" fill="url(#core)"/>

    <!-- Subtle abstract United States / flag infrastructure layer -->
    <g opacity="0.9">
      <g class="flagA">
        <path d="M-20 105C145 63 292 147 450 108C640 61 779 143 955 99C1080 68 1158 82 1240 106" stroke="#EF4444" stroke-width="18" stroke-linecap="round" opacity=".32"/>
        <path d="M-35 150C142 107 302 190 466 151C650 107 795 188 972 146C1096 116 1168 132 1246 154" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity=".24"/>
        <path d="M-42 197C142 158 314 235 482 198C664 158 820 232 988 195C1108 168 1184 179 1245 198" stroke="#EF4444" stroke-width="14" stroke-linecap="round" opacity=".28"/>
      </g>

      <g class="flagB">
        <path d="M-10 355C190 309 348 387 540 347C725 308 874 376 1048 338C1150 316 1204 328 1250 348" stroke="#2563EB" stroke-width="17" stroke-linecap="round" opacity=".25"/>
        <path d="M50 403C226 363 392 430 578 394C762 358 910 418 1072 386C1168 367 1212 379 1250 397" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".18"/>
        <path d="M92 448C286 412 450 468 620 435C800 400 940 452 1096 421C1177 405 1220 414 1254 429" stroke="#EF4444" stroke-width="13" stroke-linecap="round" opacity=".23"/>
      </g>

      <rect x="72" y="72" width="182" height="126" rx="24" fill="#0B1E4A" opacity=".38"/>
      <g fill="#FFFFFF" filter="url(#blueGlow)">
        <circle class="node" cx="104" cy="102" r="2.9"/>
        <circle class="node2" cx="142" cy="102" r="2.6"/>
        <circle class="node3" cx="180" cy="102" r="2.9"/>
        <circle class="node" cx="218" cy="102" r="2.6"/>
        <circle class="node2" cx="123" cy="134" r="2.7"/>
        <circle class="node3" cx="161" cy="134" r="2.5"/>
        <circle class="node" cx="199" cy="134" r="2.7"/>
        <circle class="node2" cx="237" cy="134" r="2.5"/>
        <circle class="node3" cx="104" cy="166" r="2.6"/>
        <circle class="node" cx="142" cy="166" r="2.9"/>
        <circle class="node2" cx="180" cy="166" r="2.6"/>
        <circle class="node3" cx="218" cy="166" r="2.9"/>
      </g>
    </g>

    <!-- Technical topology / orbital architecture -->
    <g opacity=".92">
      <path class="orbitA" d="M132 278C274 98 492 62 600 62C820 62 1014 134 1092 278C964 446 762 490 600 490C380 490 220 410 132 278Z" stroke="url(#orangeBlue)" stroke-width="1.35"/>
      <path class="orbitB" d="M224 278C336 154 466 118 600 118C734 118 864 154 976 278C864 402 734 438 600 438C466 438 336 402 224 278Z" stroke="#38BDF8" stroke-opacity=".38" stroke-width="1"/>
      <path class="orbitC" d="M600 66C694 154 736 230 736 278C736 326 694 402 600 490C506 402 464 326 464 278C464 230 506 154 600 66Z" stroke="#F97316" stroke-opacity=".40" stroke-width="1"/>
    </g>

    <!-- Animated flow paths -->
    <g opacity=".68">
      <path class="flow" d="M186 304C310 258 378 306 492 270C606 234 720 284 824 248C930 212 998 246 1080 224" stroke="#F97316" stroke-width="1.6" stroke-linecap="round"/>
      <path class="flow" d="M158 238C292 300 384 218 506 250C628 282 738 214 856 242C972 270 1046 224 1120 250" stroke="#38BDF8" stroke-width="1.35" stroke-linecap="round" opacity=".75"/>
    </g>

    <!-- Beam sweep -->
    <g class="beam">
      <rect x="250" y="-60" width="105" height="700" fill="url(#whiteHot)" opacity=".20"/>
    </g>

    <!-- Ghost typography -->
    <text x="600" y="128"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="124"
      font-weight="950"
      letter-spacing="13"
      fill="#FFFFFF"
      class="ghost">
      ZEN
    </text>

    <!-- Name block -->
    <text x="600" y="180"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="88"
      font-weight="950"
      letter-spacing="8.5"
      fill="url(#nameGradient)"
      stroke="#FFFFFF"
      stroke-opacity=".22"
      stroke-width="1.25"
      filter="url(#nameGlow)"
      class="name">
      ALEX LESCHIK
    </text>

    <path d="M252 206H948" stroke="url(#whiteHot)" stroke-width="2.2" stroke-linecap="round" opacity=".74"/>

    <text x="600" y="238"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="17"
      font-weight="900"
      letter-spacing="4.6"
      fill="#FDBA74"
      class="subtitle">
      FOUNDER OF ZEN AI CO. · CREATOR OF ARSENAL
    </text>

    <!-- Historic claim plaque -->
    <g class="plaque" filter="url(#softShadow)">
      <rect x="205" y="264" width="790" height="104" rx="30" fill="#020617" fill-opacity=".76" stroke="url(#orangeBlue)" stroke-width="2.4"/>
      <rect x="220" y="278" width="760" height="76" rx="23" fill="#0F172A" fill-opacity=".44" stroke="#FFFFFF" stroke-opacity=".10"/>

      <text x="600" y="309"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21"
        font-weight="950"
        letter-spacing="2.6"
        fill="#FFFFFF">
        FOUNDER OF THE 1ST YOUTH AI LITERACY PROGRAM
      </text>

      <text x="600" y="340"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19"
        font-weight="950"
        letter-spacing="5.2"
        fill="#CBD5E1">
        IN UNITED STATES HISTORY
      </text>
    </g>

    <!-- System command strip -->
    <g class="terminal">
      <rect x="250" y="396" width="700" height="58" rx="19" fill="#020617" fill-opacity=".62" stroke="#334155" stroke-opacity=".55"/>
      <circle cx="282" cy="425" r="5" fill="#EF4444" opacity=".86"/>
      <circle cx="302" cy="425" r="5" fill="#F97316" opacity=".86"/>
      <circle cx="322" cy="425" r="5" fill="#22C55E" opacity=".86"/>

      <text x="350" y="430"
        font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace"
        font-size="15"
        font-weight="800"
        fill="#E2E8F0">
        ./launch_arsenal --agents --automations --dashboards --credentials
      </text>
    </g>

    <!-- Click CTA -->
    <text x="600" y="490"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="15"
      font-weight="950"
      letter-spacing="3.4"
      fill="#E2E8F0"
      class="cta">
      CLICK THE HERO TO ENTER ARSENAL.WORLD
    </text>

    <text x="600" y="520"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="12.5"
      font-weight="850"
      letter-spacing="2.6"
      fill="#94A3B8">
      AGENTS → AUTOMATIONS → DASHBOARDS → AI LITERACY → VERIFIED SKILLS → ECOSYSTEM
    </text>

    <!-- Corner accents -->
    <path d="M42 88V42H92" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
    <path d="M1158 88V42H1108" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
    <path d="M42 472V518H92" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
    <path d="M1158 472V518H1108" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="557" rx="36.5" stroke="url(#orangeBlue)" stroke-opacity=".34" stroke-width="3"/>
</svg>
