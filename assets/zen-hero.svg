<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alex Leschik - ZEN AI Co. and Arsenal</title>
  <desc id="desc">Animated command-center hero for Alex Leschik, founder of ZEN AI Co. and creator of Arsenal.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="560" rx="36"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="34%" stop-color="#07111F"/>
      <stop offset="68%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#031B2B"/>
    </linearGradient>

    <linearGradient id="signal" x1="70" y1="0" x2="1130" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="18%" stop-color="#F97316"/>
      <stop offset="43%" stop-color="#FDE68A"/>
      <stop offset="62%" stop-color="#22C55E"/>
      <stop offset="82%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="name" x1="78" y1="0" x2="720" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".38"/>
      <stop offset="35%" stop-color="#F97316" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#64748B" stroke-width="1" opacity=".14"/>
      <circle cx="0" cy="0" r="1.1" fill="#94A3B8" opacity=".20"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 .98
        0 0 0 0 .45
        0 0 0 0 .09
        0 0 0 .82 0" result="orange"/>
      <feMerge>
        <feMergeNode in="orange"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 .10
        0 0 0 0 .74
        0 0 0 0 .95
        0 0 0 .78 0" result="cyan"/>
      <feMerge>
        <feMergeNode in="cyan"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity=".50"/>
    </filter>

    <style>
      .grid { animation: gridMove 22s linear infinite; }
      .scan { animation: scan 5.2s ease-in-out infinite; }
      .rail { stroke-dasharray: 20 26; animation: rail 2.8s linear infinite; }
      .railSlow { stroke-dasharray: 8 18; animation: railSlow 4.8s linear infinite; }
      .orbitA { animation: spin 24s linear infinite; transform-origin: 842px 278px; }
      .orbitB { animation: spinReverse 33s linear infinite; transform-origin: 842px 278px; }
      .orbitC { animation: spin 18s linear infinite; transform-origin: 842px 278px; }
      .nodeA { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
      .nodeB { animation: pulse 4.1s ease-in-out infinite .45s; transform-origin: center; }
      .nodeC { animation: pulse 4.8s ease-in-out infinite .9s; transform-origin: center; }
      .draw { stroke-dasharray: 1120; stroke-dashoffset: 1120; animation: draw 2.9s cubic-bezier(.2,.8,.2,1) forwards, breathe 5.4s ease-in-out infinite 2.9s; }
      .chip { animation: chipIn .9s ease-out forwards; opacity: 0; transform: translateY(12px); }
      .chip2 { animation-delay: .18s; }
      .chip3 { animation-delay: .36s; }
      .chip4 { animation-delay: .54s; }
      .cursor { animation: blink 1.05s steps(1,end) infinite; }
      .ticker { animation: ticker 19s linear infinite; }

      @keyframes gridMove { to { transform: translate(40px, 40px); } }
      @keyframes scan {
        0%,100% { transform: translateX(-920px) skewX(-14deg); opacity: 0; }
        18% { opacity: .68; }
        55% { transform: translateX(920px) skewX(-14deg); opacity: .26; }
        82% { opacity: 0; }
      }
      @keyframes rail { to { stroke-dashoffset: -92; } }
      @keyframes railSlow { to { stroke-dashoffset: -64; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinReverse { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%,100% { transform: scale(.72); opacity: .44; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes breathe {
        0%,100% { filter: drop-shadow(0 0 10px rgba(249,115,22,.35)); }
        50% { filter: drop-shadow(0 0 24px rgba(56,189,248,.58)); }
      }
      @keyframes chipIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes ticker {
        from { transform: translateX(1090px); }
        to { transform: translateX(-1120px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid, .scan, .rail, .railSlow, .orbitA, .orbitB, .orbitC, .nodeA, .nodeB, .nodeC, .draw, .chip, .cursor, .ticker {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <rect class="grid" x="-80" y="-80" width="1360" height="720" fill="url(#grid)"/>
    <ellipse cx="842" cy="278" rx="322" ry="250" fill="url(#halo)" opacity=".86"/>

    <g opacity=".70">
      <path class="rail" d="M64 128C214 84 334 168 480 126C624 84 756 140 892 110C1022 82 1110 116 1160 142" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
      <path class="railSlow" d="M40 402C210 338 338 432 496 382C654 334 760 420 914 370C1042 328 1122 358 1180 386" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
      <path class="rail" d="M130 286C276 230 396 316 542 270C704 220 820 310 970 258C1060 226 1128 238 1170 260" stroke="#22C55E" stroke-width="1.35" stroke-linecap="round" opacity=".66"/>
    </g>

    <g class="scan">
      <rect x="252" y="-80" width="96" height="740" fill="url(#signal)" opacity=".20"/>
    </g>

    <path d="M48 70H1152" stroke="url(#signal)" stroke-width="2.4" stroke-linecap="round" opacity=".78"/>
    <path d="M48 490H1152" stroke="url(#signal)" stroke-width="2.4" stroke-linecap="round" opacity=".58"/>

    <g transform="translate(74 78)">
      <text x="0" y="0" fill="#94A3B8" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="800">
        LIVE AI SYSTEMS PROFILE
      </text>

      <text x="0" y="92" fill="url(#name)" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="950" class="draw">
        ALEX LESCHIK
      </text>

      <text x="2" y="136" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="850">
        Founder, ZEN AI Co. | Creator, Arsenal
      </text>

      <text x="2" y="170" fill="#FDBA74" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="850">
        Agentic infrastructure for deployment-first AI systems
      </text>

      <g transform="translate(0 220)">
        <g class="chip">
          <rect x="0" y="0" width="172" height="42" rx="13" fill="#020617" fill-opacity=".74" stroke="#F97316" stroke-opacity=".62"/>
          <text x="86" y="27" text-anchor="middle" fill="#FFEDD5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">AGENTS</text>
        </g>
        <g class="chip chip2">
          <rect x="188" y="0" width="186" height="42" rx="13" fill="#020617" fill-opacity=".74" stroke="#22C55E" stroke-opacity=".56"/>
          <text x="281" y="27" text-anchor="middle" fill="#DCFCE7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">AUTOMATIONS</text>
        </g>
        <g class="chip chip3">
          <rect x="390" y="0" width="178" height="42" rx="13" fill="#020617" fill-opacity=".74" stroke="#38BDF8" stroke-opacity=".56"/>
          <text x="479" y="27" text-anchor="middle" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">DASHBOARDS</text>
        </g>
        <g class="chip chip4">
          <rect x="584" y="0" width="182" height="42" rx="13" fill="#020617" fill-opacity=".74" stroke="#A855F7" stroke-opacity=".52"/>
          <text x="675" y="27" text-anchor="middle" fill="#F5F3FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">CREDENTIALS</text>
        </g>
      </g>
    </g>

    <g filter="url(#shadow)" transform="translate(72 370)">
      <rect width="716" height="82" rx="22" fill="#020617" fill-opacity=".84" stroke="#334155" stroke-opacity=".72"/>
      <circle cx="34" cy="31" r="5.5" fill="#EF4444"/>
      <circle cx="56" cy="31" r="5.5" fill="#F97316"/>
      <circle cx="78" cy="31" r="5.5" fill="#22C55E"/>
      <text x="108" y="37" fill="#E2E8F0" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="800">
        ./arsenal deploy --agents --workflows --students --cloud
      </text>
      <text x="108" y="62" fill="#94A3B8" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="13" font-weight="700">
        status: idea -&gt; system -&gt; dashboard -&gt; credential
      </text>
      <rect class="cursor" x="650" y="26" width="10" height="18" rx="2" fill="#38BDF8"/>
    </g>

    <g transform="translate(842 278)">
      <g opacity=".96">
        <ellipse class="orbitA" cx="0" cy="0" rx="246" ry="122" stroke="url(#signal)" stroke-width="1.5"/>
        <ellipse class="orbitB" cx="0" cy="0" rx="190" ry="190" stroke="#38BDF8" stroke-opacity=".42" stroke-width="1.2"/>
        <ellipse class="orbitC" cx="0" cy="0" rx="118" ry="232" stroke="#F97316" stroke-opacity=".44" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="66" fill="#020617" fill-opacity=".80" stroke="#E2E8F0" stroke-opacity=".18"/>
        <circle cx="0" cy="0" r="44" fill="#0F172A" stroke="url(#signal)" stroke-width="2"/>
        <text x="0" y="-7" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="950">ARSENAL</text>
        <text x="0" y="16" text-anchor="middle" fill="#FDBA74" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="850">SYSTEM CORE</text>
      </g>

      <g filter="url(#cyanGlow)">
        <line x1="-178" y1="-92" x2="-44" y2="-24" stroke="#38BDF8" stroke-opacity=".42"/>
        <line x1="178" y1="-92" x2="44" y2="-24" stroke="#22C55E" stroke-opacity=".42"/>
        <line x1="-196" y1="96" x2="-46" y2="28" stroke="#F97316" stroke-opacity=".42"/>
        <line x1="188" y1="96" x2="46" y2="28" stroke="#A855F7" stroke-opacity=".38"/>

        <circle class="nodeA" cx="-178" cy="-92" r="8" fill="#38BDF8"/>
        <circle class="nodeB" cx="178" cy="-92" r="8" fill="#22C55E"/>
        <circle class="nodeC" cx="-196" cy="96" r="8" fill="#F97316"/>
        <circle class="nodeB" cx="188" cy="96" r="8" fill="#A855F7"/>
      </g>

      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850" fill="#E2E8F0">
        <text x="-252" y="-110">Agent Builder</text>
        <text x="118" y="-110">Model Routing</text>
        <text x="-258" y="126">ZENGINE</text>
        <text x="122" y="126">Vault + Credentials</text>
      </g>
    </g>

    <g opacity=".84">
      <rect x="0" y="512" width="1200" height="32" fill="#020617" fill-opacity=".58"/>
      <text class="ticker" y="534" fill="#CBD5E1" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="13" font-weight="800">
        BUILD SYSTEMS | LAUNCH AGENTS | VERIFY SKILLS | EXPAND CAPABILITY | ARSENAL.WORLD | ZEN AI CO. | YOUTH AI LITERACY INFRASTRUCTURE |
      </text>
    </g>

    <g filter="url(#glow)">
      <text x="600" y="472" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="950">
        FOUNDER OF WHAT I POSITION AS THE 1ST SUCCESSFUL YOUTH AI LITERACY PROGRAM IN US HISTORY
      </text>
    </g>

    <text x="600" y="508" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">
      CLICK THE HERO TO ENTER ARSENAL.WORLD
    </text>

    <rect x="1.5" y="1.5" width="1197" height="557" rx="34.5" stroke="url(#signal)" stroke-opacity=".44" stroke-width="3"/>
    <path d="M42 96V42H98" stroke="#F97316" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1158 96V42H1102" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M42 464V518H98" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1158 464V518H1102" stroke="#F97316" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>