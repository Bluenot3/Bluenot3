<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">ZEN AI builder manifesto</title>
  <desc id="desc">Animated manifesto cycling through build what matters, ship what works, and prove what changed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12080D"/><stop offset="0.48" stop-color="#02040A"/><stop offset="1" stop-color="#06142A"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EF4444"/><stop offset="0.48" stop-color="#FFFFFF"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.08"/></pattern>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.dash{stroke-dasharray:16 20;animation:dash 3s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-144}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.dash,.pulse{animation:none!important}animate{display:none}}</style>
  </defs>
  <rect x="2" y="2" width="1196" height="256" rx="26" fill="url(#bg)" stroke="#26334C" stroke-width="3"/>
  <rect x="2" y="2" width="1196" height="256" rx="26" fill="url(#grid)"/>
  <path d="M38 205 H1162" stroke="#182338" stroke-width="10" stroke-linecap="round"/>
  <path d="M38 205 H1162" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" class="dash" filter="url(#glow)"/>
  <g class="sans" text-anchor="middle">
    <g opacity="1"><animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="10.5s" repeatCount="indefinite"/><text x="600" y="123" fill="#FFFFFF" font-size="64" font-weight="950" letter-spacing="-2">BUILD WHAT MATTERS.</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.38;0.61;0.66;1" dur="10.5s" repeatCount="indefinite"/><text x="600" y="123" fill="#FFFFFF" font-size="64" font-weight="950" letter-spacing="-2">SHIP WHAT WORKS.</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.61;0.66;0.71;0.95;1" dur="10.5s" repeatCount="indefinite"/><text x="600" y="123" fill="#FFFFFF" font-size="64" font-weight="950" letter-spacing="-2">PROVE WHAT CHANGED.</text></g>
    <text x="600" y="163" fill="#94A3B8" font-size="14" font-weight="850" letter-spacing="3">ZEN AI CO. × ARSENAL</text>
  </g>
  <g class="mono"><circle cx="45" cy="35" r="5" fill="#EF4444" class="pulse"/><text x="60" y="40" fill="#CBD5E1" font-size="11">FOUNDER-LED // DEPLOYMENT-FIRST</text><text x="1155" y="40" text-anchor="end" fill="#64748B" font-size="11">ALEX LESCHIK // WASHINGTON, D.C.</text></g>
</svg>
